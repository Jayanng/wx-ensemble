# TLS termination for wx-ensemble on Pocket Beta TestNet.
#
# Audit rule A5: the staked endpoint must be https on a hostname, not a bare IP.
# Audit rule A6: it must answer over TLS with a publicly trusted certificate.
# The Pocket RelayMiner serves plain HTTP on loopback; this terminates TLS for it.
#
# WHY SOME PATHS BYPASS THE RELAYER
# ---------------------------------
# The relayer accepts Pocket relay requests, which are signed protobuf
# RelayRequest bodies. A plain GET to it returns
# "invalid relay request: body must be a valid RelayRequest protobuf".
#
# That is correct for relay traffic, but the on-chain service card publishes a
# publicly retrievable specification URL and health checks. Those must work over
# plain HTTPS or the card is describing something that does not exist. So the
# metadata and probe paths are served directly by the backend, and everything
# else, including the metered /v1/ensemble call, goes to the relayer and
# requires a signed relay.
#
#   /healthz /openapi.json /v1/identity /v1/probe   -> backend (public metadata)
#   everything else                                 -> relayer (signed relays)

upstream wx_backend {
    server 127.0.0.1:8787;
    keepalive 8;
}

upstream pocket_relayer {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name HOSTNAME_PLACEHOLDER;
    # ACME http-01 renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name HOSTNAME_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/HOSTNAME_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOSTNAME_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;

    # --- public metadata and probes: straight to the backend -----------------
    #
    # GET / is included deliberately. It is the endpoint URL a person pastes
    # into a browser, and without this it falls through to the relayer and
    # returns "invalid relay request", which is correct but tells a visitor
    # nothing about what this is or how to call it.
    location = / {
        proxy_pass http://wx_backend;
        proxy_set_header Host $host;
    }
    location = /healthz {
        proxy_pass http://wx_backend;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://wx_backend;
        proxy_set_header Host $host;
    }
    location = /v1/identity {
        proxy_pass http://wx_backend;
        proxy_set_header Host $host;
    }
    location = /v1/probe {
        proxy_pass http://wx_backend;
        proxy_set_header Host $host;
    }

    # --- everything else is signed relay traffic -----------------------------
    location / {
        proxy_pass http://pocket_relayer;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
